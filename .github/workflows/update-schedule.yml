name: Update Schedule Data

on:
  schedule:
    # Daily at 00:00 Asia/Taipei.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate schedule data
        run: pnpm schedule:generate

      - name: Validate schedule
        run: pnpm schedule:validate

      - name: Commit updated schedule data
        run: |
          if git diff --quiet -- src/data/schedule.generated.ts; then
            echo "Schedule data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule.generated.ts
          git commit -m "chore: update schedule data"
          git push
